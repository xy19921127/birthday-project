<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A Little Surprise ✦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #FFFFFF;
    --off-white: #FAFAFA;
    --warm-gray: #E8E4DF;
    --soft-shadow: rgba(0, 0, 0, 0.06);
    --medium-shadow: rgba(0, 0, 0, 0.12);
    --dark: #1A1A1A;
    --accent: #D4A574;
    --accent-light: #F0DCC8;
    --tile-radius: 10px;
    --grid-gap: 6px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--white);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #app {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle grain overlay */
  #app::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  .hint-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #BEBBB6;
    margin-bottom: 20px;
    transition: opacity 0.6s ease;
  }

  /* ── Grid ── */
  #grid-container {
    position: relative;
    z-index: 2;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--grid-gap);
  }

  .tile {
    position: relative;
    perspective: 800px;
    cursor: default;
  }

  .tile-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    border-radius: var(--tile-radius);
  }

  .tile-inner.flipped {
    transform: rotateY(180deg);
  }

  .tile-front, .tile-back {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--tile-radius);
    overflow: hidden;
    box-shadow:
      0 1px 3px var(--soft-shadow),
      0 6px 20px var(--soft-shadow);
  }

  .tile-front {
    background-color: var(--warm-gray);
    background-image: url('cover.jpg');
    background-size: 300% 300%;
  }

  .tile-back {
    transform: rotateY(180deg);
    background-size: cover;
    background-position: center;
  }

  /* Spring shake keyframe */
  @keyframes springHit {
    0%   { transform: scale(1) translate(0, 0); }
    15%  { transform: scale(0.94) translate(0, 2px); }
    30%  { transform: scale(1.06) translate(0, -2px); }
    50%  { transform: scale(0.98) translate(0, 1px); }
    70%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .tile-inner.spring-hit {
    animation: springHit 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  /* ── Tennis Area ── */
  #tennis-area {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #racket {
    width: 52px; height: 52px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  #racket.active { opacity: 1; }

  /* Racket SVG silhouette */
  #racket svg {
    width: 100%; height: 100%;
    fill: none;
    stroke: var(--dark);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #ball {
    width: 28px; height: 28px;
    border-radius: 50%;
    position: fixed;
    z-index: 20;
    pointer-events: none;
    /* Tennis ball look */
    background: radial-gradient(circle at 35% 35%, #E2F060, #C8D840);
    box-shadow:
      inset -3px -3px 6px rgba(0,0,0,0.1),
      0 2px 8px rgba(0,0,0,0.15);
    transition: box-shadow 0.2s;
  }

  #ball::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-top-color: transparent;
    border-left-color: transparent;
    transform: rotate(-30deg);
  }

  #ball.dragging {
    box-shadow:
      inset -3px -3px 6px rgba(0,0,0,0.1),
      0 4px 16px rgba(0,0,0,0.25);
  }

  /* Trajectory dots */
  .trajectory-dot {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
    z-index: 15;
  }

  /* ── Finale Popup ── */
  #finale-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  }

  #finale-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #finale-overlay .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
  }

  #finale-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    padding: 48px 56px;
    text-align: center;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.06),
      0 1px 2px rgba(0,0,0,0.04);
    transform: translateY(30px) scale(0.95);
    transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  }

  #finale-overlay.visible #finale-card {
    transform: translateY(0) scale(1);
  }

  #finale-card h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: var(--dark);
    margin-bottom: 8px;
  }

  #finale-card p {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 15px;
    color: #999;
    letter-spacing: 0.03em;
  }

  /* ── Confetti Canvas ── */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
  }

  /* ── Counter ── */
  #counter {
    position: fixed;
    top: 28px;
    right: 28px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #C0BDB8;
    z-index: 50;
  }

  #counter span {
    color: var(--dark);
    font-weight: 500;
    transition: color 0.3s;
  }

  /* Responsive tile sizing */
  @media (max-width: 500px) {
    :root { --grid-gap: 4px; --tile-radius: 8px; }
    .hint-text { font-size: 11px; margin-bottom: 16px; }
    #tennis-area { height: 110px; }
    #finale-card { padding: 36px 40px; border-radius: 20px; }
    #finale-card h1 { font-size: 30px; }
    #counter { top: 20px; right: 20px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <p class="hint-text">Pull the ball &amp; let it fly</p>

  <div id="grid-container">
    <div id="grid"></div>
  </div>

  <div id="tennis-area">
    <div id="racket">
      <svg viewBox="0 0 52 52">
        <ellipse cx="26" cy="18" rx="14" ry="17"/>
        <line x1="26" y1="35" x2="26" y2="50"/>
        <line x1="20" y1="47" x2="32" y2="47"/>
        <!-- strings -->
        <line x1="18" y1="10" x2="18" y2="26" opacity="0.3"/>
        <line x1="22" y1="5" x2="22" y2="30" opacity="0.3"/>
        <line x1="26" y1="3" x2="26" y2="32" opacity="0.3"/>
        <line x1="30" y1="5" x2="30" y2="30" opacity="0.3"/>
        <line x1="34" y1="10" x2="34" y2="26" opacity="0.3"/>
        <line x1="14" y1="12" x2="38" y2="12" opacity="0.3"/>
        <line x1="13" y1="18" x2="39" y2="18" opacity="0.3"/>
        <line x1="14" y1="24" x2="38" y2="24" opacity="0.3"/>
      </svg>
    </div>
  </div>

  <div id="ball"></div>

  <div id="counter"><span>0</span> / 9</div>

  <div id="finale-overlay">
    <div class="backdrop"></div>
    <div id="finale-card">
      <h1>Happy Birthday!</h1>
      <p>My love, the world's best person.</p>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <audio id="bgm" src="birthday.mp3" preload="auto"></audio>
</div>

<script>
(() => {
  'use strict';

  // ── Config (original natural physics) ──
  const COLS = 3, ROWS = 3;
  const FRICTION = 0.992;
  const BOUNCE_DAMPING = 0.75;
  const MIN_SPEED = 0.4;
  const LAUNCH_MULTIPLIER = 0.28;
  const BALL_RADIUS = 14;
  const MAX_DRAG = 160;

  // ── State ──
  let tileSize, gridLeft, gridTop;
  let tiles = [];
  let revealedCount = 0;
  let ballState = { x: 0, y: 0, vx: 0, vy: 0, active: false };
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragCurrent = { x: 0, y: 0 };
  let trajectoryDots = [];
  let animFrameId = null;
  let finaleTriggered = false;
  let audioInitialized = false;

  // ── DOM ──
  const grid = document.getElementById('grid');
  const ball = document.getElementById('ball');
  const racket = document.getElementById('racket');
  const counterSpan = document.querySelector('#counter span');
  const hintText = document.querySelector('.hint-text');
  const finaleOverlay = document.getElementById('finale-overlay');
  const confettiCanvas = document.getElementById('confetti-canvas');
  const ctx = confettiCanvas.getContext('2d');
  const bgm = document.getElementById('bgm');

  // ── Audio unlock on first interaction ──
  function initAudio() {
    if (audioInitialized) return;
    audioInitialized = true;
    bgm.muted = true;
    bgm.play().then(() => { bgm.pause(); bgm.muted = false; bgm.currentTime = 0; }).catch(() => {});
  }

  // ── Image base path ──
  const IMG_BASE = '';

  // ── Init Grid ──
  function buildGrid() {
    grid.innerHTML = '';
    tiles = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const idx = r * COLS + c;
        const tile = document.createElement('div');
        tile.className = 'tile';

        const inner = document.createElement('div');
        inner.className = 'tile-inner';

        const front = document.createElement('div');
        front.className = 'tile-front';
        front.style.backgroundPosition = `${c * 50}% ${r * 50}%`;

        const back = document.createElement('div');
        back.className = 'tile-back';
        back.style.backgroundImage = `url('${IMG_BASE}${idx + 1}.jpg')`;

        inner.appendChild(front);
        inner.appendChild(back);
        tile.appendChild(inner);
        grid.appendChild(tile);

        tiles.push({ el: tile, inner, revealed: false, idx });
      }
    }
  }

  function measure() {
    const vw = window.innerWidth;
    const maxGridW = Math.min(vw * 0.82, 380);
    tileSize = Math.floor((maxGridW - 2 * parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'))) / 3);

    grid.style.width = `${tileSize * 3 + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap')) * 2}px`;

    document.querySelectorAll('.tile').forEach(t => {
      t.style.width = `${tileSize}px`;
      t.style.height = `${tileSize}px`;
    });

    const rect = grid.getBoundingClientRect();
    gridLeft = rect.left;
    gridTop = rect.top;

    resetBallPosition();
  }

  function resetBallPosition() {
    const racketRect = racket.getBoundingClientRect();
    ballState.x = racketRect.left + racketRect.width / 2 - BALL_RADIUS;
    ballState.y = racketRect.top - 36;
    ballState.vx = 0;
    ballState.vy = 0;
    ballState.active = false;
    updateBallDOM();
  }

  function updateBallDOM() {
    ball.style.left = `${ballState.x}px`;
    ball.style.top = `${ballState.y}px`;
  }

  // ── Drag / Slingshot ──
  function getPointer(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function onDragStart(e) {
    if (ballState.active || finaleTriggered) return;
    const p = getPointer(e);
    const bx = ballState.x + BALL_RADIUS;
    const by = ballState.y + BALL_RADIUS;
    const dist = Math.hypot(p.x - bx, p.y - by);
    if (dist > 70) return;

    initAudio();
    dragging = true;
    dragStart = { x: bx, y: by };
    dragCurrent = { x: p.x, y: p.y };
    ball.classList.add('dragging');
    racket.classList.add('active');
    e.preventDefault();
  }

  function onDragMove(e) {
    if (!dragging) return;
    const p = getPointer(e);
    const dx = p.x - dragStart.x;
    const dy = p.y - dragStart.y;
    const dist = Math.hypot(dx, dy);
    const clamp = Math.min(dist, MAX_DRAG);
    const angle = Math.atan2(dy, dx);

    dragCurrent.x = dragStart.x + Math.cos(angle) * clamp;
    dragCurrent.y = dragStart.y + Math.sin(angle) * clamp;

    // Move ball to drag position
    ballState.x = dragCurrent.x - BALL_RADIUS;
    ballState.y = dragCurrent.y - BALL_RADIUS;
    updateBallDOM();

    drawTrajectory();
    e.preventDefault();
  }

  function onDragEnd(e) {
    if (!dragging) return;
    dragging = false;
    ball.classList.remove('dragging');
    racket.classList.remove('active');
    clearTrajectory();

    const dx = dragStart.x - dragCurrent.x;
    const dy = dragStart.y - dragCurrent.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 12) {
      resetBallPosition();
      return;
    }

    ballState.vx = dx * LAUNCH_MULTIPLIER;
    ballState.vy = dy * LAUNCH_MULTIPLIER;
    ballState.active = true;

    if (hintText.style.opacity !== '0') {
      hintText.style.opacity = '0';
    }

    if (!animFrameId) gameLoop();
  }

  // ── Trajectory Preview ──
  function drawTrajectory() {
    clearTrajectory();
    const dx = dragStart.x - dragCurrent.x;
    const dy = dragStart.y - dragCurrent.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 15) return;

    let sx = dragStart.x;
    let sy = dragStart.y;
    const vx = dx * LAUNCH_MULTIPLIER;
    const vy = dy * LAUNCH_MULTIPLIER;
    const steps = 8;

    for (let i = 1; i <= steps; i++) {
      const t = i * 6;
      const px = sx + vx * t * 0.3;
      const py = sy + vy * t * 0.3;
      const dot = document.createElement('div');
      dot.className = 'trajectory-dot';
      dot.style.left = `${px - 2}px`;
      dot.style.top = `${py - 2}px`;
      dot.style.opacity = 1 - (i / steps) * 0.7;
      document.getElementById('app').appendChild(dot);
      trajectoryDots.push(dot);
    }
  }

  function clearTrajectory() {
    trajectoryDots.forEach(d => d.remove());
    trajectoryDots = [];
  }

  // ── Physics Loop (original — no gravity, organic friction) ──
  function gameLoop() {
    if (!ballState.active) { animFrameId = null; return; }

    ballState.x += ballState.vx;
    ballState.y += ballState.vy;
    ballState.vx *= FRICTION;
    ballState.vy *= FRICTION;

    // Wall bouncing
    const W = window.innerWidth;
    const H = window.innerHeight;

    if (ballState.x <= 0) {
      ballState.x = 0;
      ballState.vx = Math.abs(ballState.vx) * BOUNCE_DAMPING;
    }
    if (ballState.x + BALL_RADIUS * 2 >= W) {
      ballState.x = W - BALL_RADIUS * 2;
      ballState.vx = -Math.abs(ballState.vx) * BOUNCE_DAMPING;
    }
    if (ballState.y <= 0) {
      ballState.y = 0;
      ballState.vy = Math.abs(ballState.vy) * BOUNCE_DAMPING;
    }
    if (ballState.y + BALL_RADIUS * 2 >= H) {
      ballState.y = H - BALL_RADIUS * 2;
      ballState.vy = -Math.abs(ballState.vy) * BOUNCE_DAMPING;
    }

    // Tile collision
    checkTileCollisions();

    updateBallDOM();

    const speed = Math.hypot(ballState.vx, ballState.vy);
    if (speed < MIN_SPEED) {
      ballState.active = false;
      setTimeout(resetBallPosition, 300);
      animFrameId = null;
      return;
    }

    animFrameId = requestAnimationFrame(gameLoop);
  }

  function checkTileCollisions() {
    const bcx = ballState.x + BALL_RADIUS;
    const bcy = ballState.y + BALL_RADIUS;

    for (const tile of tiles) {
      if (tile.revealed) continue;

      const rect = tile.el.getBoundingClientRect();
      const closestX = Math.max(rect.left, Math.min(bcx, rect.right));
      const closestY = Math.max(rect.top, Math.min(bcy, rect.bottom));
      const distX = bcx - closestX;
      const distY = bcy - closestY;
      const dist = Math.hypot(distX, distY);

      if (dist < BALL_RADIUS) {
        // Determine collision side
        const overlapX = BALL_RADIUS - Math.abs(distX);
        const overlapY = BALL_RADIUS - Math.abs(distY);

        if (overlapX < overlapY) {
          ballState.vx = -ballState.vx * BOUNCE_DAMPING;
          ballState.x += distX > 0 ? overlapX : -overlapX;
        } else {
          ballState.vy = -ballState.vy * BOUNCE_DAMPING;
          ballState.y += distY > 0 ? overlapY : -overlapY;
        }

        revealTile(tile);
      }
    }
  }

  function revealTile(tile) {
    tile.revealed = true;
    revealedCount++;
    counterSpan.textContent = revealedCount;

    // Spring shake then flip
    tile.inner.classList.add('spring-hit');
    tile.inner.addEventListener('animationend', () => {
      tile.inner.classList.remove('spring-hit');
      tile.inner.classList.add('flipped');
    }, { once: true });

    if (revealedCount === 9 && !finaleTriggered) {
      finaleTriggered = true;
      setTimeout(triggerFinale, 900);
    }
  }

  // ── Finale ──
  function triggerFinale() {
    finaleOverlay.classList.add('visible');
    launchConfetti();
    bgm.currentTime = 0;
    bgm.play().catch(() => {});
  }

  // ── Confetti (Canvas Particles) ──
  const confettiColors = [
    '#F2C078', '#D4A574', '#E8B4B8', '#A8D8EA',
    '#FFD93D', '#C8E6C9', '#F8BBD0', '#B39DDB',
    '#FFAB91', '#80DEEA', '#E6EE9C', '#F48FB1'
  ];

  let confettiParticles = [];

  function launchConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;

    for (let i = 0; i < 200; i++) {
      confettiParticles.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * 0.5,
        w: 4 + Math.random() * 6,
        h: 8 + Math.random() * 10,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        gravity: 0.04 + Math.random() * 0.04,
        opacity: 1,
        wobble: Math.random() * 10,
        wobbleSpeed: 0.03 + Math.random() * 0.05
      });
    }
    animateConfetti();
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

    let alive = 0;
    for (const p of confettiParticles) {
      p.vy += p.gravity;
      p.x += p.vx + Math.sin(p.wobble) * 0.5;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.wobble += p.wobbleSpeed;

      if (p.y > confettiCanvas.height + 40) {
        p.opacity -= 0.02;
        if (p.opacity <= 0) continue;
      }

      alive++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    if (alive > 0) {
      requestAnimationFrame(animateConfetti);
    }
  }

  // ── Event Binding ──
  function init() {
    buildGrid();
    measure();

    window.addEventListener('resize', () => {
      measure();
      if (confettiCanvas.width) {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
    });

    // Pointer events for both mouse and touch
    document.addEventListener('mousedown', onDragStart);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchstart', onDragStart, { passive: false });
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
  }

  init();
})();
</script>
</body>
</html>
